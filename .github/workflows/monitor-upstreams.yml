name: Radar leve de skills (sem IA)
on:
  schedule:
    - cron: '37 10 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: radar-leve-skills
  cancel-in-progress: false
jobs:
  upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Consultar metadados dos repositorios monitorados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/monitor_upstreams.py --output upstream-report.json
      - name: Comparar com ultima execucao e registrar apenas novidades
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/summarize_upstream_changes.py --report upstream-report.json
