name: Validate skill structure
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned YAML parser (no model API)
        run: python3 -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3'
      - name: Check Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py
      - name: Exercise offline validator fixtures
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate all skill packages
        run: python3 scripts/validate_skills.py
